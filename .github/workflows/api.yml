name: api

on:
  push:
    branches:
      - main
    paths:
      - "Formula/**"
      - "Casks/**"
      - "scripts/generate-api.rb"
      - ".github/workflows/api.yml"

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: api
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    env:
      BRANCH: regenerate-api
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: Homebrew/actions/setup-homebrew@2026.10.26.1
      # setup-homebrew replaces the workspace of a tap repository with a fresh,
      # credential-less clone, so the repository is checked out only after it.
      - uses: actions/checkout@v7
      - run: make api
      - name: Open a pull request with the regenerated API JSON
        run: |
          git add api
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git commit -m "chore: regenerate api"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" --title "chore: regenerate api" --body "Regenerated by the \`api\` workflow from ${GITHUB_SHA}."
          fi
